name: Daily Stock Push

on:
  schedule:
    # 每天台灣時間下午 3:37 自動執行（UTC 07:37，週一至週五）
    - cron: '37 7 * * 1-5'
  workflow_dispatch: # 保留隨時手動點擊測試的按鈕

jobs:
  run-bot:
    # 【關鍵修改】直接指定穩定的 24.04 機房，避開 ubuntu-latest 正在升級 Ubuntu 26 的全球大塞車與通知
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 1. 安裝開源思源繁體中文字型 (避免圖片中的中文字變成方塊亂碼)
      - name: Install Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # 2. 安裝 Python 依賴套件 (加入了 matplotlib 繪圖套件)
      - name: Install dependencies
        run: |
          pip install requests pymupdf beautifulsoup4 urllib3 matplotlib

      # 3. 執行主程式
      - name: Run script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
