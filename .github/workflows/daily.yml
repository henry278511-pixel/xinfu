name: Daily Stock Push

on:
  schedule:
    # 每天台灣時間下午 3:45 自動執行（UTC 07:45，週一至週五）
    - cron: '45 7 * * 1-5'
  workflow_dispatch: # 保留隨時手動點擊測試的按鈕

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. 安裝開源思源繁體中文字型 (避免圖片中的中文字變成方塊亂碼)
      - name: Install Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      # 2. 安裝 Python 依賴套件 (加入了 matplotlib 繪圖套件)
      - name: Install dependencies
        run: |
          pip install requests pymupdf beautifulsoup4 urllib3 matplotlib

      # 3. 執行主程式
      - name: Run script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
